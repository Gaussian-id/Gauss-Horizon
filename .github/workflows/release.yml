name: Chiron Horizon release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: chiron-horizon-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.release-target-preflight
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a main branch release commit
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the tag to match the application version
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit-branding.mjs
      - run: node scripts/sync-connection-types.mjs --check
      - run: pnpm exec vue-tsc --noEmit -p apps/desktop/tsconfig.json
      - run: pnpm exec vitest run apps/desktop/src/lib/chiron apps/desktop/src/components/vector/__tests__ apps/desktop/src/lib/compat
      - run: pnpm test:database-availability
      - run: pnpm build:docs-export
      - run: pnpm --dir docs content:check
      - run: cargo test -p chiron-horizon-core --no-default-features --features sqlite-bundled --lib
      - run: cargo test -p chiron-horizon-core --no-default-features --features sqlite-bundled --test ai_credentials --test chirondb_connector
      - run: cargo check -p chiron-horizon-cli -p chiron-horizon-web -p chiron-horizon-mcp --no-default-features
      - run: cargo check --manifest-path plugins/sdk/cli/Cargo.toml
      - run: node --test packages/plugin-cli/tests/launcher.test.mjs packages/plugin-cli/tests/dev-launcher.test.mjs
      - name: Validate and test Java agents on JDK 21
        working-directory: agents
        run: |
          python3 scripts/validate_agents.py
          ./gradlew test shadowJar --no-daemon
          python3 scripts/validate_agent_jars.py
      - name: Validate release packaging helpers
        run: |
          (cd agents/scripts && python3 -m unittest validate_agents_test.py driver_release_packages_test.py)
          node --check scripts/stage-desktop-release.mjs
          node --check scripts/create-release-manifest.mjs

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
            extension: .dmg
            output: Chiron-Horizon_0.1.2_macos-arm64.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: app,dmg
            extension: .dmg
            output: Chiron-Horizon_0.1.2_macos-x64.dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis
            extension: .exe
            output: Chiron-Horizon_0.1.2_windows-x64-setup.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundles: deb,appimage
            extension: .deb
            output: Chiron-Horizon_0.1.2_linux-x64.deb
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-appimage-x64
            bundles: appimage
            extension: .AppImage
            output: Chiron-Horizon_0.1.2_linux-x64.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.release-target-desktop
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev libfontconfig1-dev libxdo-dev xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc --noEmit -p apps/desktop/tsconfig.json
      - name: Build clean standalone desktop bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm exec tauri build --features custom-protocol --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Smoke macOS application and ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle/macos/Chiron Horizon.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          open "$APP_PATH"
          sleep 5
          pgrep -f 'Chiron Horizon' >/dev/null
          pkill -f 'Chiron Horizon' || true
      - name: Smoke Windows NSIS installation, startup, and restart
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Chiron-Horizon-NSIS-smoke'
          Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait
          $app = Get-ChildItem $installDir -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $app) { throw 'Installed Chiron Horizon executable was not found' }
          $first = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($first.HasExited) { throw 'Chiron Horizon exited during first Windows smoke startup' }
          Stop-Process -Id $first.Id -Force
          $second = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($second.HasExited) { throw 'Chiron Horizon exited during Windows restart smoke' }
          Stop-Process -Id $second.Id -Force
      - name: Smoke Linux AppImage startup and restart under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE=$(find "$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' -type f | head -1)
          if [ -n "$APPIMAGE" ]; then
            chmod +x "$APPIMAGE"
            xvfb-run -a timeout 15s "$APPIMAGE" --no-sandbox >/tmp/chiron-horizon-appimage.log 2>&1 & first=$!
            sleep 5; kill -0 "$first"; kill "$first" || true; wait "$first" || true
            xvfb-run -a timeout 15s "$APPIMAGE" --no-sandbox >/tmp/chiron-horizon-appimage-restart.log 2>&1 & second=$!
            sleep 5; kill -0 "$second"; kill "$second" || true; wait "$second" || true
          fi
      - name: Stage immutable desktop release asset
        shell: bash
        run: node scripts/stage-desktop-release.mjs --input "$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle" --output "release/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release/${{ matrix.output }}
          if-no-files-found: error

  java-agents:
    name: Java agents and H2 smoke
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and validate Java agents
        working-directory: agents
        run: |
          ./gradlew test shadowJar --no-daemon
          python3 scripts/validate_agent_jars.py
          ./gradlew :h2:test --tests '*H2AgentProcessTest' --no-daemon
      - name: Stage versioned Java agent assets
        shell: bash
        run: |
          mkdir -p release-agents
          find agents/drivers -path '*/build/libs/chiron-horizon-agent-*.jar' -type f -exec cp {} release-agents/ \;
          python3 agents/scripts/version_agent_artifacts.py release-agents "$(cat agents/versions.json)"
      - name: Build immutable JDBC plugin package
        working-directory: plugins/jdbc
        run: |
          ./gradlew test shadowJar --no-daemon
          ./package.sh
          cp "dist/chiron-horizon-jdbc-plugin-${GITHUB_REF_NAME#v}.zip" ../../release-agents/
      - uses: actions/upload-artifact@v4
        with:
          name: java-agents
          path: release-agents/
          if-no-files-found: error

  go-agents:
    name: Native Go agents
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: agents/scripts/build_go_release_agents.sh release-agents
      - uses: actions/upload-artifact@v4
        with:
          name: go-agents
          path: release-agents/
          if-no-files-found: error

  rust-agents:
    name: Native Rust agents ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.release-target-native-agents
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      - name: Build DuckDB, TDengine, and SQLite worker agents from source
        shell: bash
        run: |
          cargo build --manifest-path agents/drivers/duckdb/Cargo.toml --locked --release --target ${{ matrix.target }}
          cargo build --manifest-path agents/drivers/tdengine/Cargo.toml --locked --release --target ${{ matrix.target }}
          cargo build -p chiron-horizon-sqlite-worker --locked --release --target ${{ matrix.target }}
          mkdir -p release-agents
          extension=''; [ "${{ runner.os }}" = 'Windows' ] && extension='.exe'
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/chiron-horizon-duckdb-driver$extension" "release-agents/chiron-horizon-agent-duckdb-$VERSION-${{ matrix.platform }}$extension"
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/chiron-horizon-tdengine-driver$extension" "release-agents/chiron-horizon-agent-tdengine-$VERSION-${{ matrix.platform }}$extension"
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/chiron-horizon-sqlite-worker$extension" "release-agents/chiron-horizon-agent-sqlite-worker-$VERSION-${{ matrix.platform }}$extension"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-agents-${{ matrix.platform }}
          path: release-agents/
          if-no-files-found: error

  managed-jre:
    name: Managed JRE 21 ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install zstd
        shell: bash
        run: |
          if command -v zstd >/dev/null; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y zstd ;;
            macOS) brew install zstd ;;
            Windows) choco install zstd -y ;;
          esac
      - run: agents/scripts/build_managed_jre.sh release-jre ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: managed-jre-${{ matrix.platform }}
          path: release-jre/
          if-no-files-found: error

  publish:
    name: Publish verified v0.1.2 release
    needs: [desktop, java-agents, go-agents, rust-agents, managed-jre]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install release packager dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd zip
      - uses: actions/download-artifact@v4
        with:
          path: release-input
          merge-multiple: true
      - name: Assemble immutable agent registry and offline bundles
        shell: bash
        run: |
          mkdir -p release
          find release-input -maxdepth 1 -type f -exec cp {} release/ \;
          python3 agents/scripts/create_release_registry.py release --tag "$GITHUB_REF_NAME" --jre-version "$(java -version 2>&1 | head -1 | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          python3 agents/scripts/build_driver_zips.py release
          JDBC_ARCHIVE="$(find release -maxdepth 1 -name "chiron-horizon-jdbc-plugin-${GITHUB_REF_NAME#v}.zip" -type f | head -1)"
          test -n "$JDBC_ARCHIVE"
          JDBC_WORK="$(mktemp -d)"
          unzip -q "$JDBC_ARCHIVE" -d "$JDBC_WORK"
          JDBC_RESOLVER="$(find "$JDBC_WORK" -path '*/bin/chiron-horizon-maven-resolver' -type f | head -1)"
          test -n "$JDBC_RESOLVER"
          chmod +x "$JDBC_RESOLVER"
          node agents/scripts/build_offline_jdbc_payload.mjs release "$JDBC_ARCHIVE" "$JDBC_RESOLVER"
          agents/scripts/build_offline_zip.sh release
          node agents/scripts/verify_offline_jdbc_release.mjs release
          python3 agents/scripts/verify_release_assets.py release --tag "$GITHUB_REF_NAME"
          node scripts/create-release-manifest.mjs release
      - name: Validate staged public assets
        run: |
          test "$(find release -maxdepth 1 -name "Chiron-Horizon_${GITHUB_REF_NAME#v}_*" -type f | wc -l)" -eq 5
          sha256sum -c release/SHA256SUMS
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Chiron Horizon ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --latest
      - name: Download published assets and reverify checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS)
          curl --fail --location --retry 3 "https://github.com/Gaussian-id/Chiron-Horizon/releases/latest/download/agent-registry.json" -o published/latest-agent-registry.json
          cmp published/agent-registry.json published/latest-agent-registry.json
